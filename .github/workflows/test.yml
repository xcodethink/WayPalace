name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: lint (ruff, warn-only in alpha)
    runs-on: ubuntu-latest
    # Alpha-phase: lint failures DO NOT block merges yet. Will be enforced
    # in a later release after contributors converge on style.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install --quiet ruff
      - name: Ruff check
        run: ruff check . || true
      - name: Ruff format check
        run: ruff format --check . || true

  smoke:
    name: smoke (install + sys.path import + metadata)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package (Tier 0, no LLM)
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -e .
      - name: Package install verifies (waypalace package importable as a namespace)
        run: |
          python -c "
          import waypalace
          import os
          # The package directory should be locatable via the installed site-packages.
          pkg_dir = os.path.dirname(waypalace.__file__)
          print(f'waypalace installed at: {pkg_dir}')
          assert os.path.isfile(os.path.join(pkg_dir, 'memory_core.py'))
          assert os.path.isfile(os.path.join(pkg_dir, 'memory_search.py'))
          print('Package layout OK')
          "
      - name: Sys.path-based module import (this is the documented usage pattern; see examples/)
        run: |
          python -c "
          import sys, os, waypalace
          # v0.1.0 modules use top-level imports (CLI-first design, not library-first).
          # The documented usage is to prepend the package directory to sys.path.
          # See examples/basic_usage.py for the canonical pattern.
          sys.path.insert(0, os.path.dirname(waypalace.__file__))
          import memory_core
          import wing_lifecycle
          import mp_metrics
          print('sys.path-based imports OK')
          "
      - name: pyproject metadata sanity
        run: |
          python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              meta = tomllib.load(f)
          proj = meta['project']
          assert proj['name'] == 'waypalace'
          assert proj['license']['text'] == 'MIT'
          assert proj['requires-python'].startswith('>=3.1')
          print('Metadata OK')
          "

  pytest-unit:
    name: pytest (unit, no daemon/chromadb)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install with dev deps
        run: |
          pip install --quiet --upgrade pip
          pip install --quiet -e ".[dev]"
      - name: Run unit tests (skip e2e/daemon — need bge-m3 model)
        run: |
          # Tests that need a live daemon socket or chromadb collection are
          # excluded from CI. Run them locally before publishing major releases.
          python -m pytest tests/ \
              --ignore=tests/test_daemon.py \
              --ignore=tests/test_e2e.py \
              -v \
              -k "not real_daemon and not mlx_llm_alive" \
              || true  # alpha-phase: don't block on test failures yet
        env:
          # Disable HuggingFace download retries in CI
          HF_HUB_DOWNLOAD_TIMEOUT: "5"
